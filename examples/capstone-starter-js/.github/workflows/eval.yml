name: eval

# Runs the capstone eval on every push and pull request, and uploads results.json.
# Set the repository variable MODEL_PROVIDER (openai, anthropic, openrouter, groq, huggingface)
# and the matching secret (OPENAI_API_KEY, ...). Without them it runs the free mock provider,
# which checks the wiring but isn't a real measurement.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER || 'mock' }}
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results.json
